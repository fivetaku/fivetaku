<svg xmlns="http://www.w3.org/2000/svg" width="426" height="170" viewBox="0 0 426 170" role="img" aria-label="GPTaku stats">
  <style>
    .num { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 27px; font-weight: 800; }
    .lbl { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <g opacity="0"><animate attributeName="opacity" begin="0.15s" dur="0.5s" values="0;1" fill="freeze"/><rect x="0.5" y="0.5" width="206" height="78" rx="10" fill="#0D1117" stroke="#30363D"/><text x="103.5" y="38" text-anchor="middle" class="num" fill="url(#brand)">4,257</text><text x="103.5" y="60" text-anchor="middle" class="lbl" fill="#8B949E">stars shipped</text></g>
  <g opacity="0"><animate attributeName="opacity" begin="0.33s" dur="0.5s" values="0;1" fill="freeze"/><rect x="219.5" y="0.5" width="206" height="78" rx="10" fill="#0D1117" stroke="#30363D"/><text x="322.5" y="38" text-anchor="middle" class="num" fill="url(#brand)">14</text><text x="322.5" y="60" text-anchor="middle" class="lbl" fill="#8B949E">plugins in the marketplace</text></g>
  <g opacity="0"><animate attributeName="opacity" begin="0.51s" dur="0.5s" values="0;1" fill="freeze"/><rect x="0.5" y="91.5" width="206" height="78" rx="10" fill="#0D1117" stroke="#30363D"/><text x="103.5" y="129" text-anchor="middle" class="num" fill="url(#brand)">269</text><text x="103.5" y="151" text-anchor="middle" class="lbl" fill="#8B949E">followers</text></g>
  <g opacity="0"><animate attributeName="opacity" begin="0.69s" dur="0.5s" values="0;1" fill="freeze"/><rect x="219.5" y="91.5" width="206" height="78" rx="10" fill="#0D1117" stroke="#30363D"/><text x="322.5" y="129" text-anchor="middle" class="num" fill="url(#brand)">52</text><text x="322.5" y="151" text-anchor="middle" class="lbl" fill="#8B949E">open-source repos</text></g>
</svg>
